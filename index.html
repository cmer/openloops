<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenLoops is the board of everything your assistant needs from you." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)" />
    <title>OpenLoops</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Set the theme before first paint so dark mode doesn't flash light. Key matches client/src/useTheme.ts. -->
    <script>try{var t=localStorage.getItem("openloops-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/src/main.tsx"></script>
  </body>
</html>
